name: Clocked
options:
  bundleIdPrefix: com.jeffbatterton
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Clocked:
    type: application
    platform: macOS
    sources: [Clocked]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffbatterton.Clocked
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Clocked
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      # The MCP server command Claude runs, in Clocked.app/Contents/Helpers.
      - target: clocked-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  clocked-mcp:
    type: tool
    platform: macOS
    sources: [ClockedMCP]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffbatterton.Clocked.mcp
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  ClockedTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClockedTests]
    dependencies:
      - target: Clocked
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clocked:
    build:
      targets:
        Clocked: all
    test:
      targets: [ClockedTests]
