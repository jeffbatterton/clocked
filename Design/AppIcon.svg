<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Clocked app icon, "Live ring": a purple progress ring with the red live dot on its end. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a46"/><stop offset="1" stop-color="#1c1c22"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a7af2"/><stop offset="1" stop-color="#4a4ac4"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ink)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="512" cy="512" r="260" fill="none" stroke="#33333d" stroke-width="80"/>
  <path d="M512,252 A260,260 0 1,1 287,642" fill="none" stroke="url(#purple)" stroke-width="80" stroke-linecap="round"/>
  <circle cx="287" cy="642" r="62" fill="#ff5a5f" stroke="#1f1f26" stroke-width="18"/>
  <rect x="497" y="360" width="30" height="168" rx="15" fill="#f5f5f7"/>
  <rect x="497" y="498" width="30" height="120" rx="15" fill="#f5f5f7" transform="rotate(-60 512 513)"/>
  <circle cx="512" cy="513" r="26" fill="#f5f5f7"/>
</svg>
